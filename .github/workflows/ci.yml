name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start application
        env:
          PORT: 3000
          DB_PATH: /tmp/agent-spend-smoke.db
        run: |
          npm start > /tmp/agent-spend.log 2>&1 &
          echo $! > /tmp/agent-spend.pid
      - name: Smoke-test public routes
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          for path in / /activity /approvals /keys /help /getting-started; do
            echo "Checking $path"
            curl --fail --silent --show-error "http://127.0.0.1:3000$path" >/dev/null
          done
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/agent-spend.log || true
